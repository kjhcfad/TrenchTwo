            /* ---------- import (CSV, Excel via SheetJS, JSON, pasted text, folders) ---------- */
            const SUPPORTED_EXTS = [".csv", ".tsv", ".xlsx", ".xls", ".ods", ".json", ".txt"];

            function isSupportedQuestionFile(name) {
                const lower = String(name || "").toLowerCase();
                if (!lower || lower.startsWith(".") || lower.startsWith("~$")) return false;
                return SUPPORTED_EXTS.some((ext) => lower.endsWith(ext));
            }

            function inferSetNameFromFile(file, fallbackSet = "") {
                if (fallbackSet) return fallbackSet;
                const rel = String(file.webkitRelativePath || file.name || "");
                const parts = rel.split("/").filter(Boolean);
                if (parts.length >= 3) {
                    return parts[parts.length - 2].replace(/[_-]+/g, " ").trim();
                }
                const base = (parts[parts.length - 1] || file.name || "Imported Set").replace(/\.[^.]+$/, "");
                return base.replace(/[_-]+/g, " ").trim() || "Imported Set";
            }

            function normalizeRow(raw, idx = 0, defaultSet = "") {
                if (!raw || typeof raw !== "object") return null;
                const obj = {};
                Object.keys(raw).forEach((k) => {
                    obj[String(k).trim().toLowerCase()] = raw[k];
                });

                const text = String(obj.text || obj.question || obj.prompt || "").trim();
                const answer = String(obj.answer || obj.ans || obj.correct || "").trim();
                const model = String(obj.model || obj.model_answer || "").trim();
                if (!text || (!answer && !model)) return null;

                let type = String(obj.type || "short").trim().toLowerCase();
                const rawOpts = obj.options || obj.choices || "";
                const options = Array.isArray(rawOpts)
                    ? rawOpts.map((x) => String(x).trim()).filter(Boolean)
                    : String(rawOpts)
                          .split(/\s*\|\s*|\s*;\s*/)
                          .map((x) => x.trim())
                          .filter(Boolean);

                if (!["short", "fill", "mc", "tf", "extended"].includes(type)) {
                    if (options.length >= 2) type = "mc";
                    else if (["true", "false"].includes(norm(answer))) type = "tf";
                    else if (text.includes("___")) type = "fill";
                    else type = "short";
                }

                const diffRaw = String(obj.difficulty || obj.level || "medium").trim().toLowerCase();
                const difficulty = ["easy", "medium", "hard"].includes(diffRaw) ? diffRaw : "medium";

                const rawSets = obj.sets || obj.set || "";
                let sets = Array.isArray(rawSets)
                    ? rawSets.map((x) => String(x).trim()).filter(Boolean)
                    : String(rawSets)
                          .split(/[,;|]/)
                          .map((x) => x.trim())
                          .filter(Boolean);
                if (!sets.length && defaultSet) sets = [defaultSet];

                return {
                    id: obj.id ? String(obj.id) : `imp_${Date.now()}_${idx}_${uid()}`,
                    subject: String(obj.subject || "").trim(),
                    board: String(obj.board || obj.exam_board || "").trim(),
                    topic: String(obj.topic || "").trim(),
                    subtopic: String(obj.subtopic || "").trim(),
                    difficulty,
                    type,
                    marks: Math.max(1, +obj.marks || 1),
                    text,
                    options,
                    answer: answer || model,
                    model,
                    explain: String(obj.explain || obj.explanation || obj.note || "").trim(),
                    image: String(obj.image || obj.img || "").trim(),
                    sets,
                    fav: String(obj.fav || "").toLowerCase() === "true" || obj.fav === 1 || obj.fav === "1",
                };
            }

            function parseTextBlock(rawText, defaultSet = "") {
                const s = String(rawText || "").trim();
                if (!s) return [];
                if (s.startsWith("[") || s.startsWith("{")) {
                    const parsed = JSON.parse(s);
                    const arr = Array.isArray(parsed) ? parsed : Array.isArray(parsed.questions) ? parsed.questions : [parsed];
                    return arr.map((item, i) => normalizeRow(item, i, defaultSet)).filter(Boolean);
                }
                if (typeof XLSX !== "undefined" && (s.includes(",") || s.includes("\t")) && s.includes("\n")) {
                    const wb = XLSX.read(s, { type: "string" });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
                    const mapped = rows.map((r, i) => normalizeRow(r, i, defaultSet)).filter(Boolean);
                    if (mapped.length) return mapped;
                }
                return s
                    .split(/\n\s*\n+/)
                    .map((block, idx) => {
                        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
                        let qText = "",
                            ans = "",
                            exp = "",
                            sub = "",
                            top = "";
                        lines.forEach((l) => {
                            if (/^q[:.)-]\s*/i.test(l)) qText = l.replace(/^q[:.)-]\s*/i, "").trim();
                            else if (/^a[:.)-]\s*/i.test(l)) ans = l.replace(/^a[:.)-]\s*/i, "").trim();
                            else if (/^(explain|note|exp)[:.)-]\s*/i.test(l)) exp = l.replace(/^(explain|note|exp)[:.)-]\s*/i, "").trim();
                            else if (/^subject[:.)-]\s*/i.test(l)) sub = l.replace(/^subject[:.)-]\s*/i, "").trim();
                            else if (/^topic[:.)-]\s*/i.test(l)) top = l.replace(/^topic[:.)-]\s*/i, "").trim();
                            else if (!qText) qText = l;
                            else if (!ans) ans = l;
                        });
                        if (!qText || !ans) return null;
                        return normalizeRow(
                            { id: `txt_${idx}_${uid()}`, text: qText, answer: ans, explain: exp, subject: sub, topic: top },
                            idx,
                            defaultSet
                        );
                    })
                    .filter(Boolean);
            }

            async function extractItemsFromFile(file, defaultSet = "") {
                const setLabel = inferSetNameFromFile(file, defaultSet);
                const name = file.name.toLowerCase();
                if (name.endsWith(".xlsx") || name.endsWith(".xls") || name.endsWith(".ods")) {
                    if (typeof XLSX === "undefined") throw new Error("SheetJS library not available");
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: "array" });
                    const items = [];
                    wb.SheetNames.forEach((sheetName) => {
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
                        rows.forEach((r, i) => {
                            const normItem = normalizeRow(r, i, setLabel);
                            if (normItem) items.push(normItem);
                        });
                    });
                    return items;
                }
                const txt = await file.text();
                return parseTextBlock(txt, setLabel);
            }

            async function handleFile(file) {
                if (!file) return;
                try {
                    I = await extractItemsFromFile(file);
                    toast(`Parsed ${I?.length || 0} question(s) from ${file.name}`);
                    imp();
                } catch (e) {
                    toast("Could not parse file: " + (e.message || "invalid format"));
                }
            }

            async function collectDroppedFiles(dataTransfer) {
                const items = [...(dataTransfer?.items || [])];
                const entries = items
                    .map((it) => (typeof it.webkitGetAsEntry === "function" ? it.webkitGetAsEntry() : null))
                    .filter(Boolean);

                if (!entries.length) {
                    return [...(dataTransfer?.files || [])];
                }

                const collected = [];
                async function walkEntry(entry, prefix = "") {
                    if (!entry) return;
                    if (entry.isFile) {
                        const f = await new Promise((resolve) => entry.file(resolve, () => resolve(null)));
                        if (f) {
                            const relPath = prefix ? `${prefix}/${f.name}` : f.name;
                            try {
                                Object.defineProperty(f, "webkitRelativePath", {
                                    value: relPath,
                                    configurable: true,
                                });
                            } catch (e) {}
                            collected.push(f);
                        }
                    } else if (entry.isDirectory) {
                        const reader = entry.createReader();
                        let batch = [];
                        do {
                            batch = await new Promise((resolve) => reader.readEntries(resolve, () => resolve([])));
                            for (const child of batch) {
                                await walkEntry(child, prefix ? `${prefix}/${entry.name}` : entry.name);
                            }
                        } while (batch.length > 0);
                    }
                }

                for (const ent of entries) {
                    await walkEntry(ent, "");
                }
                return collected;
            }

            async function handleFolderFiles(fileList) {
                const files = [...(fileList || [])].filter((f) => isSupportedQuestionFile(f.name));
                if (!files.length) {
                    return toast("No supported question files found in folder (.csv, .xlsx, .json, .txt)");
                }
                const rootFolder = (files[0].webkitRelativePath || "").split("/")[0] || "Selected folder";
                let allItems = [];
                let parsedFiles = 0;

                for (let i = 0; i < files.length; i++) {
                    try {
                        const items = await extractItemsFromFile(files[i]);
                        if (items.length) {
                            allItems = allItems.concat(items);
                            parsedFiles++;
                        }
                    } catch (e) {}
                }

                I = allItems;
                toast(`Found ${allItems.length} question(s) across ${parsedFiles}/${files.length} file(s) in "${rootFolder}"`);
                imp();
            }

            function imp() {
                const preview = Array.isArray(I) ? I : null;
                app.innerHTML = `<h2>Import questions</h2>
                    <p class="sub">Import CSV, Excel (.xlsx/.xls), JSON, or pasted Q&amp;A text into your local question bank—or pick a folder on your laptop.</p>
                    <div class="drop" id="drop">
                        <p>Drop files or a folder here, <label class="f" style="display:inline"><span style="color:var(--acc);text-decoration:underline;cursor:pointer">choose a file</span><input id="file_in" type="file" accept=".csv,.tsv,.xlsx,.xls,.ods,.json,.txt" style="display:none"></label> or <label class="f" style="display:inline"><span style="color:var(--acc);text-decoration:underline;cursor:pointer">choose a folder</span><input id="dir_in" type="file" webkitdirectory directory multiple style="display:none"></label></p>
                        <small>Columns: subject, board, topic, subtopic, difficulty, type, marks, text, options, answer, model, explain, sets · Folder files are tagged as question sets automatically</small>
                    </div>
                    <label class="f" style="margin-top:16px">Paste JSON, CSV, or Q:/A: blocks
                        <textarea id="paste_in" rows="6" placeholder="Q: What is Newton's second law equation?&#10;A: F = ma&#10;Subject: Physics&#10;Topic: Forces"></textarea>
                    </label>
                    <div class="row">
                        <button class="ghost" id="parse_btn">Preview pasted text</button>
                        <button class="ghost" id="sync_folder_btn">Sync question-sets/ folder</button>
                        <button class="ghost" id="sample_btn">Load GCSE sample pack</button>
                    </div>
                    ${
                        preview
                            ? `<h3>Preview (${preview.length} question${preview.length === 1 ? "" : "s"})</h3>
                               <div class="row"><button class="pri" id="commit_btn">Import ${preview.length} question(s)</button><button class="ghost" id="clear_prev">Clear</button></div>
                               <table>
                                   <thead><tr><th>Subject</th><th>Set</th><th>Prompt</th><th>Answer</th></tr></thead>
                                   <tbody>
                                       ${preview
                                           .slice(0, 25)
                                           .map(
                                               (item) => `<tr>
                                                   <td>${esc(item.subject || "—")}</td>
                                                   <td>${esc((item.sets || []).join(", ") || "—")}</td>
                                                   <td>${esc(item.text)}</td>
                                                   <td>${esc(String(item.answer || "").split("|")[0])}</td>
                                               </tr>`
                                           )
                                           .join("")}
                                   </tbody>
                               </table>`
                            : ""
                    }`;

                const drop = $("#drop");
                const fi = $("#file_in");
                const di = $("#dir_in");
                drop.ondragover = (e) => {
                    e.preventDefault();
                    drop.classList.add("over");
                };
                drop.ondragleave = () => drop.classList.remove("over");
                drop.ondrop = async (e) => {
                    e.preventDefault();
                    drop.classList.remove("over");
                    const droppedFiles = await collectDroppedFiles(e.dataTransfer);
                    if (!droppedFiles.length) return;
                    const hasFolder = droppedFiles.some((f) => (f.webkitRelativePath || "").includes("/"));
                    if (hasFolder || droppedFiles.length > 1) {
                        await handleFolderFiles(droppedFiles);
                    } else {
                        await handleFile(droppedFiles[0]);
                    }
                };
                fi.onchange = () => {
                    if (fi.files?.[0]) handleFile(fi.files[0]);
                };
                di.onchange = () => {
                    if (di.files?.length) handleFolderFiles(di.files);
                };

                $("#parse_btn").onclick = () => {
                    try {
                        const items = parseTextBlock($("#paste_in").value);
                        if (!items.length) return toast("No valid questions found");
                        I = items;
                        toast(`Parsed ${items.length} question(s)`);
                        imp();
                    } catch (e) {
                        toast("Parse error: " + (e.message || "invalid text"));
                    }
                };

                $("#sample_btn").onclick = loadSamplePack;
                const sfb = $("#sync_folder_btn");
                if (sfb) sfb.onclick = async () => {
                    await syncQuestionSetsFromFolder(false);
                    route();
                };

                const cb = $("#commit_btn");
                if (cb)
                    cb.onclick = () => {
                        Q = [...preview, ...Q];
                        saveQ();
                        I = null;
                        toast(`Imported ${preview.length} questions`);
                        go("library");
                    };
                const cp = $("#clear_prev");
                if (cp)
                    cp.onclick = () => {
                        I = null;
                        imp();
                    };
            }

            /* ---------- stats ---------- */
            function stats() {
                const totalAtt = S.att.length;
                const okAtt = S.att.filter((a) => a.ok).length;
                const bySub = {};
                S.att.forEach((a) => {
                    const key = a.subject || "General";
                    bySub[key] ??= { ok: 0, n: 0 };
                    bySub[key].n++;
                    if (a.ok) bySub[key].ok++;
                });

                const byTop = {};
                S.att.forEach((a) => {
                    const key = a.topic || "General";
                    byTop[key] ??= { ok: 0, n: 0 };
                    byTop[key].n++;
                    if (a.ok) byTop[key].ok++;
                });

                const renderBars = (map) => {
                    const entries = Object.entries(map).sort((a, b) => pct(a[1].ok, a[1].n) - pct(b[1].ok, b[1].n));
                    if (!entries.length) return `<p class="meta">No attempt data yet.</p>`;
                    return entries
                        .map(([label, d]) => {
                            const p = pct(d.ok, d.n);
                            return `<div class="bar2"><span>${esc(label)}</span><i><s style="width:${p}%"></s></i><small>${p}% (${d.ok}/${d.n})</small></div>`;
                        })
                        .join("");
                };

                app.innerHTML = `<h2>My stats</h2>
                    <div class="stat">
                        <div><b>${(S.best || 0) * 10} m</b><small>deepest dive</small></div>
                        <div><b>${S.dives.length}</b><small>dives</small></div>
                        <div><b>${totalAtt}</b><small>answered</small></div>
                        <div><b>${pct(okAtt, totalAtt)}%</b><small>accuracy</small></div>
                    </div>
                    <h3>By subject</h3>
                    ${renderBars(bySub)}
                    <h3>By topic</h3>
                    ${renderBars(byTop)}
                    <h3>Recent dives</h3>
                    ${
                        S.dives.length
                            ? `<table>
                                   <thead><tr><th>Date</th><th>Tier</th><th>Depth</th><th>Accuracy</th></tr></thead>
                                   <tbody>
                                       ${S.dives
                                           .slice(0, 15)
                                           .map(
                                               (d) => `<tr>
                                                   <td>${esc(new Date(d.ts).toLocaleDateString("en-GB", { day: "numeric", month: "short" }))}</td>
                                                   <td>${esc(d.tier)}</td>
                                                   <td>${d.depth} m</td>
                                                   <td>${d.acc}%</td>
                                               </tr>`
                                           )
                                           .join("")}
                                   </tbody>
                               </table>`
                            : `<p class="meta">No completed dives yet.</p>`
                    }
                    <div class="row" style="margin-top:28px">
                        <button class="ghost" id="reset_stats">Reset stats</button>
                    </div>`;

                $("#reset_stats").onclick = async () => {
                    const ok = await modal("<p>Reset all dive history, personal best, and attempt stats?</p>");
                    if (!ok) return;
                    S = { att: [], dives: [], best: 0 };
                    saveS();
                    toast("Stats reset");
                    stats();
                };
            }

            // Boot router + sync CSV question sets from question-sets/ folder
            route();
            syncQuestionSetsFromFolder(true).then((count) => {
                if (count > 0) route();
            });
        </script>
    </body>
</html>
